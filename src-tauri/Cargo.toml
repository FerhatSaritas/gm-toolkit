[package]
name = "gm-toolkit"
version = "0.1.0"
description = "Local-first GM toolkit for running TTRPGs"
edition = "2021"
rust-version = "1.82"

[lib]
name = "gm_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
comrak = "0.49.0"
rand = "0.9"
notify = "8"
fuzzy-matcher = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
